openapi: "3.0.0" 

info:
  version: "0.1 Alpha"
  title: Songbook API
  description: "A web API of songs in a musician's songbook. You can GET the entire list, or filter the list for one or more songs based on title, artist, genre, or decade."
  contact:
    name: Pete Witcher
    email: pete.witcher@gmail.com

servers:
  - url: http:127.0.0.1:5000/api/v1/resources/songs
    description: Local test server

paths:
  /all:
    get:
      summary: "Get a list of all songs"
      description: "Get a list of all the songs in the database."
      operationId: api_all
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllResponse'
        "500":
          description: Server error
  /title:
    get:
      summary: "Find a single song by its title"
      description: "Search for a single song by its title."
      operationId: api_title
      parameters:
        - name: title
          in: query
          description: Title of the song
          required: false
          explode: true
          schema:
            $ref: '#/components/schemas/SongTitle'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleResponse"
        "500":
          description: Server error
  /artist:
    get:
      summary: "Get a list of songs by one artist"
      description: "Filter songs by artist."
      operationId: api_artist
      parameters:
        - name: artist
          in: query
          description: Name of the artist
          required: false
          explode: true
          schema:
            $ref: "#/components/schemas/ArtistResponse"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistResponse'
        "500":
          description: Server error
  /genre:
    get:
      summary: "Get songs in the same genre"
      description: "Filter songs by genre."
      operationId: api_genre
      parameters:
        - name: genre
          in: query
          description: Songs in the same genre
          required: false
          explode: true
          schema:
            $ref: "#/components/schemas/GenreResponse"
            enum:
              - Pop
              - Folk
              - Country
              - Classic Rock
            default: Country
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        "500":
          description: Server error
  /decade:
    get:
      summary: "Get a list of songs from the same decade"
      description: "Filter songs by decade."
      operationId: api_decade
      parameters:
        - name: decade
          in: query
          description: Songs from the same decade
          required: false
          explode: true
          schema:
            $ref: "#/components/schemas/DecadeResponse"
            enum:
              - 70s
              - 80s
              - 90s
              - 2000s
            default: 70s
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecadeResponse'
        "500":
          description: Server error
components:
  schemas:
    # ---------- Reusable primitive schemas ----------
    SongTitle:
      type: string
      description: Title of song
      example: Spooky

    ArtistName:
      type: string
      description: Name of artist
      example: Atlanta Rhythm Section

    GenreName:
      type: string
      description: Genre of song
      example: Classic Rock

    Decade:
      type: string
      description: Decade when the song was released
      example: 70s

    Status:
      type: string
      description: |
        Three possible statuses:

        * `OK`: No errors occurred.
        * `INVALID_REQUEST`: One or more parameters are missing or invalid.
        * `UNKNOWN_ERROR`: The request could not be processed due to a server error. The request may succeed if you try again.
      example: OK

    # ---------- Reusable "results" object shapes ----------
    Song:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/SongTitle"
        artist:
          $ref: "#/components/schemas/ArtistName"
        genre:
          $ref: "#/components/schemas/GenreName"
        decade:
          $ref: "#/components/schemas/Decade"

    TitleResult:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/SongTitle"

    ArtistResult:
      type: object
      properties:
        artist:
          $ref: "#/components/schemas/ArtistName"

    GenreResult:
      type: object
      properties:
        genre:
          $ref: "#/components/schemas/GenreName"

    DecadeResult:
      type: object
      properties:
        decade:
          $ref: "#/components/schemas/Decade"

    # ---------- Response wrappers (what your endpoints return) ----------
    AllResponse:
      title: Response
      type: object
      properties:
        results:
          $ref: "#/components/schemas/Song"
        status:
          $ref: "#/components/schemas/Status"

    TitleResponse:
      title: Response
      type: object
      properties:
        results:
          $ref: "#/components/schemas/TitleResult"
        status:
          $ref: "#/components/schemas/Status"

    ArtistResponse:
      title: Response
      type: object
      properties:
        results:
          $ref: "#/components/schemas/ArtistResult"
        status:
          $ref: "#/components/schemas/Status"

    GenreResponse:
      title: Response
      type: object
      properties:
        results:
          $ref: "#/components/schemas/GenreResult"
        status:
          $ref: "#/components/schemas/Status"

    DecadeResponse:
      title: Response
      type: object
      properties:
        results:
          $ref: "#/components/schemas/DecadeResult"
        status:
          $ref: "#/components/schemas/Status"
